plugins:
  - rubocop-rake
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "pkg/**/*"
    - "vendor/**/*"

Layout/LineLength:
  Max: 120
  AllowedPatterns:
    - '^\s*assert_equal'
    - '^\s*#'
    - '^\s*"'
    - 'spec\.description'

Style/StringLiterals:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/AsciiComments:
  Enabled: false

Style/PercentLiteralDelimiters:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Minitest/MultipleAssertions:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/BlockNesting:
  Enabled: false

Metrics/ModuleLength:
  Max: 250

